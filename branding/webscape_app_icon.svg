<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filtros de Brilho -->
    <filter id="glow-bright" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-comet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.8" />
    </filter>

    <!-- Gradientes -->
    <!-- Letra W: Branco perolado metálico para ciano vivo -->
    <linearGradient id="w-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F0FDFA" />
      <stop offset="65%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bisel metálico 3D nas bordas -->
    <linearGradient id="w-bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="45%" stop-color="#7DD3FC" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="1" />
    </linearGradient>

    <!-- Cauda de Luz do Cometa -->
    <linearGradient id="comet-tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="15%" stop-color="#67E8F9" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <!-- Arco do Horizonte: Ciano Elétrico -> Azul Safira suave nas pontas -->
    <linearGradient id="horizon-arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0" />
      <stop offset="15%" stop-color="#00F5D4" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Brilho difuso sob o horizonte -->
    <radialGradient id="planet-glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Brilho do Planeta abaixo do horizonte (sem corte reto) -->
  <path d="M 40,430 Q 256,330 472,430 Q 256,490 40,430 Z" fill="url(#planet-glow)" />

  <!-- 2. Rastro do Cometa atravessando por trás da letra -->
  <g filter="url(#glow-comet)">
    <!-- Feixe amplo translúcido -->
    <polygon points="56,86 340,316 320,336 40,102" fill="url(#comet-tail)" opacity="0.55" />
    <!-- Feixe de raio laser fino central -->
    <line x1="50" y1="90" x2="330" y2="320" stroke="url(#comet-tail)" stroke-width="8" stroke-linecap="round" />
    <line x1="50" y1="90" x2="220" y2="230" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <!-- Cabeça do Cometa com brilho cósmico -->
    <circle cx="50" cy="90" r="16" fill="#FFFFFF" filter="url(#glow-bright)" />
    <circle cx="50" cy="90" r="8" fill="#E0F2FE" />
  </g>

  <!-- 3. Letra "W" Serifada Principal (Chanfrada, 3D, Clássica) -->
  <g filter="url(#drop-shadow)">
    <!-- Letra W completa -->
    <path d="
      M 64,120
      L 152,120
      L 152,146
      L 132,146
      L 174,380
      L 234,146
      L 210,146
      L 210,120
      L 302,120
      L 302,146
      L 278,146
      L 338,380
      L 380,146
      L 360,146
      L 360,120
      L 448,120
      L 448,146
      L 424,146
      L 352,430
      L 306,430
      L 256,226
      L 206,430
      L 160,430
      L 88,146
      L 64,146
      Z"
      fill="url(#w-body)"
      stroke="url(#w-bevel)"
      stroke-width="6"
      stroke-linejoin="round"
    />

    <!-- Reflexos chanfrados de luz nas diagonais principais -->
    <polygon points="98,154 168,418 178,418 120,154" fill="#FFFFFF" opacity="0.45" />
    <polygon points="252,242 302,418 312,418 262,242" fill="#FFFFFF" opacity="0.35" />

    <!-- Filetes superiores das serifas -->
    <line x1="66" y1="123" x2="150" y2="123" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <line x1="212" y1="123" x2="300" y2="123" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <line x1="362" y1="123" x2="446" y2="123" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- 4. Arco do Planeta Curvado Luminoso (Na base da letra) -->
  <g filter="url(#glow-bright)">
    <!-- Brilho exterior difuso -->
    <path d="M 40,430 Q 256,330 472,430" fill="none" stroke="url(#horizon-arc)" stroke-width="16" stroke-linecap="round" opacity="0.85" />
    <!-- Arco central nítido branco-ciano -->
    <path d="M 40,430 Q 256,330 472,430" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- Estrelas cintilantes sutis -->
  <circle cx="430" cy="80" r="3.5" fill="#FFFFFF" filter="url(#glow-comet)" />
  <circle cx="455" cy="180" r="2.5" fill="#BAE6FD" opacity="0.8" />
  <circle cx="70" cy="220" r="2" fill="#67E8F9" opacity="0.6" />
</svg>
